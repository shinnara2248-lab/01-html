<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

<body>
    <h1>select</h1>
<p>여러개의 요소중에 하나를 선택할때 사용, 드롭다운 방식</p>
<select>
    <option value="02">02</option>
    <option value="032">032</option>
    <option value="010">010</option>
    <option value="054">054</option>
    <option value="070">070</option>
</select><br>

<h2>option</h2>
<p>옵션값을 그룹으로 묶을때 사용</p>
<label for="drink">음료수를 선택하세요</label>
<select id="drink">
<optgroup label="커피">
<option value="아아">아아</option>
<option value="라떼">라떼</option>
<option value="에스프레소">에스프레소</option>

</optgroup>
<optgroup label="티">
<option value="아이스티">아이스티</option>
<option value="레몬티">레몬티</option>
<option value="민트티">민트티</option>
</optgroup>
</select>

<h2>여러줄 글상자</h2> 
<textarea name="" id="" cols="60" rows="10"></textarea>



</body>
</html>
