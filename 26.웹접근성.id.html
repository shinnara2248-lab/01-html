<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id, headers</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>id, headers</h1>
    <p>웹접근성을 높이기 위해서, 데이터를 읽을때 제목을 함께 읽도록</p>
    <table>
        <tr>
            <th>연도</th>
            <th id="site1">신청사이트수</th>
            <th id="site2">인증사이트수</th>
            <th id="pass">햡격률</th>
        </tr>
        <!-- tr4>th+td*3 -->
        <!-- +는 형제라는 뜻 -->
        <tr>
            <th id="y2020">2020년</th>
            <td headers="y2020 site1">1000</td>
            <td headers="y2020 site2">500</td>
            <td headers="y2020 pass">50%</td>
        </tr>
        <tr>
            <th id="y2021">2021년</th>
            <td headers="y2021 site1">700</td>
            <td headers="y2021 site2">490</td>
            <td headers="y2021 pass">70%</td>
        </tr>
        <tr>
            <th id="y2022">2022년</th>
            <td headers="y2022 site1">2500</td>
            <td headers="y2022 site2">2500</td>
            <td headers="y2022 pass">100%</td>
        </tr>
        <tr>
            <th id="y2023">2023년</th>
            <td headers="y2023 site1">500</td>
            <td headers="y2023 site2">400</td>
            <td headers="y2023 pass">80%</td>
        </tr>
       
    </table>
</body>

</html>
