<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-제목관련테그</title>
</head>
<body>
    홈페이지
    제목
    <h1>제목1</h1>
    홈페이지에서 제일 중요한 로고
    <h2>제목2</h2>
    본문의 제목
    <h3>제목3</h3>
    <h4>제목4</h4>
    <h5>제목5</h5>
    <h6>제목6</h6>
    <!-- 아래는 오류검사용, 1~6까지만 있음 -->
    <h7>제목7</h7>

    웹표준에서는 중요도를 나타낼때도 제목을 사용한다
    h1-로고
    h2-메인메뉴,섹션의 제목
    섹션의 제목 : h2~h6를 단계별로 사용가능

</body>
</html>
