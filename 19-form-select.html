<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>select</h1>
    <p>여러개의 요소중에 하나를 선택할때 사용한다. 드롭다운방식</p>
    <select name="" id="">
        <option value="02">02</option>
        <option value="032">032</option>
        <option value="010">010</option>
        <option value="054">054</option>
        <option value="070">070</option>
    </select>-
    <input type="text" title="전화번호 두번째자리" maxlength="4" size="4"> -
    <input type="text" title="전화번호 세번째자리" maxlength="4" size="4"><br>

    <h2>optgroup</h2>
    <p>옵션값을 그룹으로 묶을때 사용한다</p>
    <label for="drink">음료수를 선택하세요</label>
    <select id="drink">
        <optgroup label="커피">
            <option value="아아">아아</option>
            <option value="라떼">라떼</option>
            <option value="에슾">에슾</option>
        </optgroup>
        <optgroup label="티">
            <option value="아이스티">아이스티</option>
            <option value="레몬티">레몬티</option>
            <option value="민트티">민트티</option>
        </optgroup>
    </select>

    <h2>여러줄 글상자</h2>
    <textarea name="" id="" cols="60" rows="10"></textarea>
</body>

</html>
