<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>수화물 정보</h1>
    <form>
        <table>
            <!-- tr*7>th+td -->
            <tr>
                <th><label for="pCount">패키지수</label></th>
                <td><input type="number" id="pCount" min="1" value="1"></td>
            </tr>
            <tr>
                <th>패키지가 일치합니까?</th>
                <td>
                    <label><input type="radio" name="package">예</label>
                    <label><input type="radio" name="package">아니오</label>
                </td>
            </tr>
            <tr>
                <th><label for="weigth">패지별 무개</label></th>
                <td>
                    <input type="weigth" id="weigth"> 
                    <select name="weigth" id="weigth">
                    <option value="kg">킬로그램</option>
                    <option value="g">그램</option></select>
                </td>
                <td></td>
            </tr>
            <tr>
                <th></th>
                <td> <label><input type="checkbox">고객 번호를 사용하여 전송</label></td>
            </tr>
            <tr>
                <th><label for="pickup">픽업방문접수</label></th>
                <td><select name="" id="pickup">
<option value="픽업">픽업</option>
<option value="방문" selected>방문</option>
                </select></td>
            </tr>
            <tr>
                <th><label for="senddate">발송날짜</label></th>
                <td><input type="date" id="senddate"></td>
            </tr>
            <tr>
                <th colspan="2">
                    <input type="submit" value="빠른견적받기">
                <input type="button" value="상세견적">
                 <input type="button" value="상세견적 받기">
                </th>
            
                <!-- <td></td> -->
            </tr>
        </table>
    </form>
</body>

</html>
